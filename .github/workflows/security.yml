---
name: security

# Run for all pushes to master and pull requests when Go or YAML files change
on:
  push:
    branches:
      - master
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '23 20 * * 2'

jobs:
  security-repo-scan:
    name: security-repo-scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          security-checks: 'vuln,secret'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          skip-dirs: 'tests'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  image-scan:
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        config:
          - image: openrm/krakend-ce
            dockerfile: krakend-ce/Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout krakend-ce
        uses: actions/checkout@v4
        with:
          path: krakend-ce

      # go.mod's krakend-jose/krakend-cel/krakend-opencensus/krakend-martian
      # replace directives point at ../krakend-<name> (see
      # krakend-ce/REBASE_PLAYBOOK.md for why) -- the build needs them
      # checked out as siblings of krakend-ce, matching the Dockerfile.
      - name: Checkout krakend-jose
        uses: actions/checkout@v4
        with:
          repository: openrm/krakend-jose
          path: krakend-jose
      - name: Checkout krakend-cel
        uses: actions/checkout@v4
        with:
          repository: openrm/krakend-cel
          path: krakend-cel
      - name: Checkout krakend-opencensus
        uses: actions/checkout@v4
        with:
          repository: openrm/krakend-opencensus
          path: krakend-opencensus
      - name: Checkout krakend-martian
        uses: actions/checkout@v4
        with:
          repository: openrm/krakend-martian
          path: krakend-martian

      - name: Set the environment variables
        working-directory: krakend-ce
        run: |
          echo "GOLANG_VERSION=$(grep -m 1 GOLANG_VERSION Makefile | sed 's/^.*= //g')" >> $GITHUB_ENV
          echo "ALPINE_VERSION=$(grep -m 1 ALPINE_VERSION Makefile | sed 's/^.*= //g')" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ matrix.config.image }}
          tags: |
            type=sha

      - name: "Build image ${{ matrix.config.image }}"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.config.dockerfile }}
          build-args: |
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner in image mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.meta.outputs.tags }}
          scanners: 'vuln'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          trivyignores: 'krakend-ce/.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'