name: Weekly image build, scan & push
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'
permissions:
  actions: read
  contents: read
concurrency:
  group: build-and-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set the environment variables
        run: |
          echo "GOLANG_VERSION=$(grep -m 1 GOLANG_VERSION Makefile | sed 's/.*:= //')" >> "$GITHUB_ENV"
          echo "ALPINE_VERSION=$(grep -m 1 ALPINE_VERSION Makefile | sed 's/.*:= //')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: |
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          push: false
          load: true
          tags: openrm/krakend:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: openrm/krakend:latest
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table

      # Best-effort weekly image: a failing scan must not block the push (the
      # job still goes red so the findings stay visible), but there is nothing
      # to push if the build itself failed.
      - name: Log in to Docker Hub
        if: always() && steps.build.outcome == 'success'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Tag and push
        if: always() && steps.build.outcome == 'success'
        run: |
          docker tag openrm/krakend:latest openrm/krakend:weekly
          docker push openrm/krakend:latest
          docker push openrm/krakend:weekly
